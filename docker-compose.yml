services:
  db:
    image: postgres:16-alpine
    container_name: undangan-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: undangan
      POSTGRES_PASSWORD: undangan_dev_password
      POSTGRES_DB: undangan
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: